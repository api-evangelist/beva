name: beva
description: >-
  beva (贝瓦网), operated by ProKids Technology Corp / 芝兰玉树（北京）科技股份有限公司, is a Chinese
  IP-and-technology driven family education and entertainment company. Its flagship
  original IP is the little beaver "Beva" (贝瓦) and the "Beva Children's Songs" (贝瓦儿歌)
  brand, spanning children's music, animation, literature and interactive entertainment,
  distributed across web, mobile, OTT, IPTV and television channels. Through its ProKids
  Copyright Content Open Platform (open.beva.com) beva offers online-application and
  offline content-access APIs that let third-party mobile apps and smart hardware —
  story machines, smart speakers and kids' robots such as MiTu, Rokid and the Doraemon
  story machine — embed licensed children's audio and video content. Backed by Qiming
  Venture Partners.
